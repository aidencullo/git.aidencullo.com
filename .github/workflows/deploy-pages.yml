name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CONTRIBUTIONS_API_URL: ${{ vars.VITE_CONTRIBUTIONS_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stats/package-lock.json

      - name: Install dependencies
        working-directory: stats
        run: npm ci

      - name: Fetch contributions
        working-directory: stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-contributions.mjs

      - name: Build
        working-directory: stats
        run: npm run build -- --base=/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stats/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
